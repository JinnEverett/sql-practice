; PgBouncer cho bài O04. Chạy trong container tạm `o04-pgb` cùng mạng với sql-practice-pg (xem solutions/ex03.md).
[databases]
; mọi DB trỏ về Postgres thật; pool_size ở đây là số kết nối SERVER tối đa cho mỗi cặp (db, user)
o04_bench = host=sql-practice-pg port=5432 dbname=o04_bench pool_size=10
; hai entry nhỏ để tái hiện bẫy transaction mode khi nhiều client chen nhau (ex06)
o04_one = host=sql-practice-pg port=5432 dbname=o04_bench pool_size=1
o04_two = host=sql-practice-pg port=5432 dbname=o04_bench pool_size=2

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; transaction: trả server connection về pool ngay khi COMMIT/ROLLBACK (đa số app web dùng chế độ này)
pool_mode = transaction
; số client được nhận (rẻ: mỗi client chỉ tốn vài KB, không phải một process Postgres)
max_client_conn = 500
default_pool_size = 10
; dành riêng vài kết nối cho quản trị khi pool đầy
reserve_pool_size = 2
reserve_pool_timeout = 3
; dọn kết nối server nhàn rỗi quá lâu
server_idle_timeout = 600
; chờ lấy kết nối từ pool tối đa bao lâu trước khi báo lỗi cho client
query_wait_timeout = 30
admin_users = postgres
ignore_startup_parameters = extra_float_digits
